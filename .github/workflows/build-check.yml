name: Build Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 build check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        # Required by third-party/tokenizers-cpp (compiles a Rust crate).
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show environment
        shell: pwsh
        run: |
          cmake --version
          rustc --version
          cargo --version

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGENIEXPROC_ENABLE_VISION=ON `
            -DGENIEXPROC_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release -j

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-x64
          path: |
            build/**/*.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/**/*.log
          if-no-files-found: ignore
          retention-days: 7
